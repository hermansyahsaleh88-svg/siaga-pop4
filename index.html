<html lang="id">

<title>SIAGA P0-P4 Online &mdash; Checklist Pemeliharaan Mesin Pembangkit</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F2F4F1;
  --surface:#FFFFFF;
  --ink:#16232B;
  --muted:#5C6B72;
  --primary:#0B4F6C;
  --primary-dark:#073349;
  --primary-tint:#E7EEF0;
  --accent:#D98F2B;
  --danger:#AF4327;
  --danger-tint:#F7E7E1;
  --ok:#2E7D4F;
  --ok-tint:#E4F1E9;
  --pending:#B5791A;
  --pending-tint:#FBF0DC;
  --border:#DEE3E0;
  --border-strong:#C6CFCB;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,35,43,.06), 0 1px 0 rgba(22,35,43,.03);
  --font-head:'Archivo', 'Inter', sans-serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-head); margin:0 0 4px; color:var(--ink); letter-spacing:-0.01em;}
h1{font-size:24px; font-weight:800;}
h2{font-size:15px; font-weight:700; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border);}
h3{font-size:14px; font-weight:700; margin-bottom:10px;}
p{margin:0;}
.mono{font-family:var(--font-mono); letter-spacing:-0.01em;}
.muted{color:var(--muted);}
.small{font-size:13px;}
a{color:var(--primary);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

/* ---------- botones ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 18px; border-radius:7px; border:1px solid transparent;
  font-weight:600; font-size:14px; transition:background .15s, border-color .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border-strong);}
.btn-ghost:hover{background:var(--primary-tint); border-color:var(--primary);}
.btn-danger{background:#fff; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-tint);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:13px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:14px; padding:0;}
.link-btn:hover{text-decoration:underline;}
.icon-btn{
  width:28px; height:28px; border-radius:6px; border:1px solid var(--border-strong); background:#fff;
  color:var(--muted); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none;
}
.icon-btn:hover{color:var(--danger); border-color:var(--danger);}

/* ---------- login ---------- */
.login-wrap{display:grid; grid-template-columns:1.05fr 1fr; min-height:100vh;}
.login-side{
  background:radial-gradient(circle at 15% 12%, #10617f 0%, var(--primary-dark) 55%, #051f2b 100%);
  color:#fff; padding:56px 48px; display:flex; flex-direction:column; justify-content:space-between;
}
.login-brand{display:flex; align-items:center; gap:14px;}
.gear-mark{color:#D98F2B; flex:none; opacity:.95;}
.gear-mark.small{color:var(--accent);}
.login-brand-title{font-family:var(--font-head); font-size:22px; font-weight:800; letter-spacing:.02em;}
.login-brand-sub{font-size:13px; color:#BFD8E2; margin-top:2px;}
.login-points{list-style:none; padding:0; margin:40px 0 0; display:flex; flex-direction:column; gap:18px; max-width:420px;}
.login-points li{position:relative; padding-left:22px; font-size:14.5px; color:#E4EEF1; line-height:1.55;}
.login-points li::before{content:''; position:absolute; left:0; top:8px; width:8px; height:8px; border-radius:2px; background:var(--accent);}
.login-footnote{font-size:12.5px; color:#7FA2AF; letter-spacing:.03em;}
.login-form-panel{display:flex; align-items:center; justify-content:center; padding:32px;}
.login-form{width:100%; max-width:360px;}
.login-form h1{font-size:26px; margin-bottom:6px;}
.login-hint{color:var(--muted); font-size:14px; margin-bottom:28px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:18px;}
.field > span{font-size:13px; font-weight:600; color:var(--ink);}
.field input, .field select, .field textarea{
  padding:11px 12px; border:1px solid var(--border-strong); border-radius:7px; background:#fff; color:var(--ink);
  width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field input:disabled{background:#F5F6F5; color:var(--muted);}
.login-error{
  background:var(--danger-tint); color:var(--danger); border:1px solid #E5C3B6; border-radius:7px;
  padding:10px 12px; font-size:13.5px; margin-bottom:16px;
}

/* ---------- shell ---------- */
.shell{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:24px; padding:0 24px; height:64px; background:var(--surface);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
}
.topbar-brand{display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:800; font-size:16px; color:var(--primary-dark); flex:none;}
.topnav{display:flex; gap:4px; flex:1; overflow-x:auto;}
.navlink{
  background:none; border:none; padding:9px 14px; border-radius:7px; font-weight:600; font-size:14px; color:var(--muted); white-space:nowrap;
}
.navlink:hover{background:var(--primary-tint); color:var(--primary-dark);}
.navlink.active{background:var(--primary); color:#fff;}
.topbar-user{display:flex; align-items:center; gap:12px; flex:none;}
.server-status{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;}
.server-status .dot{width:7px; height:7px; border-radius:50%; flex:none;}
.server-status.online{background:var(--ok-tint); color:var(--ok);}
.server-status.online .dot{background:var(--ok);}
.server-status.offline{background:var(--danger-tint); color:var(--danger);}
.server-status.offline .dot{background:var(--danger); animation:pulse-dot 1.4s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;} 50%{opacity:.3;}}
.user-chip{display:flex; align-items:center; gap:10px;}
.user-avatar{
  width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; flex:none;
}
.user-meta{line-height:1.25;}
.user-name{font-size:13.5px; font-weight:700;}
.user-role{font-size:11.5px; color:var(--muted);}
.main{flex:1; padding:28px 24px 60px;}

/* ---------- page layout ---------- */
.page{max-width:1080px; margin:0 auto;}
.page-narrow{max-width:640px;}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{margin-bottom:4px;}
.offline-note{margin-top:6px; max-width:560px;}
.head-actions{display:flex; gap:10px;}

/* ---------- stat cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border-strong);
  border-radius:8px; padding:16px 18px; box-shadow:var(--shadow);
}
.stat-card.tone-pending{border-left-color:var(--pending);}
.stat-card.tone-ok{border-left-color:var(--ok);}
.stat-card.tone-reject{border-left-color:var(--danger);}
.stat-value{font-family:var(--font-head); font-size:28px; font-weight:800;}
.stat-label{font-size:12.5px; color:var(--muted); margin-top:4px; font-weight:600;}

/* ---------- panels & tables ---------- */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow);}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.panel-head h2{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.form-panel{max-width:640px;}
.table{width:100%; border-collapse:collapse; font-size:14px;}
.table th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
  font-weight:700; padding:9px 10px; border-bottom:1px solid var(--border);
}
.table td{padding:12px 10px; border-bottom:1px solid var(--border);}
.table tbody tr:last-child td{border-bottom:none;}
.table.compact td, .table.compact th{padding:8px 10px; font-size:13.5px;}
.row-click{cursor:pointer;}
.row-click:hover td{background:var(--primary-tint);}
.cell-strong{font-weight:600;}
.cell-sub{font-size:12px; color:var(--muted); margin-top:2px;}
.col-cek{text-align:center; width:48px;}
.empty{padding:26px 8px; text-align:center; color:var(--muted); font-size:14px;}
.empty.small{padding:10px 0; font-size:13px; text-align:left;}

.pill{display:inline-block; padding:3px 9px; border-radius:5px; font-size:12px; font-weight:700;}
.pill-level{background:var(--primary-tint); color:var(--primary-dark);}

.status-badge{display:inline-flex; align-items:center; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;}
.status-badge.lg{padding:6px 14px; font-size:13px;}
.st-pending{background:var(--pending-tint); color:var(--pending);}
.st-ok{background:var(--ok-tint); color:var(--ok);}
.st-reject{background:var(--danger-tint); color:var(--danger);}

/* ---------- filter bar ---------- */
.filter-bar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.filter-bar select{padding:9px 12px; border:1px solid var(--border-strong); border-radius:7px; background:#fff; font-size:13.5px;}

/* ---------- form: level picker, checklist ---------- */
.level-picker{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.level-opt{position:relative; display:block;}
.level-opt input{position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; cursor:pointer; z-index:1;}
.level-opt-box{
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 6px; border:1.5px solid var(--border-strong);
  border-radius:8px; cursor:pointer; text-align:center; color:var(--muted);
}
.level-opt-box strong{font-family:var(--font-head); font-size:17px; color:var(--ink);}
.level-opt-box small{font-size:11px;}
.level-opt input:checked + .level-opt-box{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-dark);}
.level-opt input:checked + .level-opt-box strong{color:var(--primary-dark);}
.level-opt input:focus-visible + .level-opt-box{outline:2px solid var(--primary); outline-offset:2px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 20px;}

.stack-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.stack-row{display:flex; align-items:center; gap:8px;}
.row-no{width:20px; flex:none; color:var(--muted); font-size:13px;}
.stack-row input{flex:1; padding:9px 11px; border:1px solid var(--border-strong); border-radius:7px;}

.check-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.check-grid.one-col{grid-template-columns:1fr;}
.check-item{display:flex; align-items:center; gap:9px; padding:10px 12px; border:1px solid var(--border); border-radius:7px; font-size:13.5px;}
.check-item input{width:16px; height:16px; accent-color:var(--primary);}

.cat-block{margin-bottom:18px;}
.cat-block:last-child{margin-bottom:0;}
.cat-title{font-weight:700; font-size:13.5px; color:var(--primary-dark); margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed var(--border);}
.citem{display:grid; grid-template-columns:1.1fr 1.1fr 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid #F0F2F1;}
.citem:last-child{border-bottom:none;}
.citem-check{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.citem-check input{width:16px; height:16px; accent-color:var(--primary); flex:none;}
.citem-aksi{font-size:12.5px; color:var(--muted);}
.citem-ket{padding:7px 10px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; width:100%;}

.form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:6px;}
.form-actions.sticky{
  position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 70%, transparent); padding:16px 0 4px; margin-top:0;
}

.photo-grid{display:flex; flex-wrap:wrap; gap:10px;}
.photo-thumb{position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:#F0F1EF;}
.photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-remove{
  position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(22,35,43,.7); color:#fff; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.photo-add{
  width:96px; height:96px; border:1.5px dashed var(--border-strong); border-radius:8px; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:12px; color:var(--primary); font-weight:600; cursor:pointer; padding:6px;
}
.photo-add:hover{background:var(--primary-tint); border-color:var(--primary);}
.photo-grid.view .photo-thumb{width:120px; height:120px; cursor:zoom-in;}

/* ---------- lightbox (perbesar foto dokumentasi) ---------- */
.photo-lightbox{
  position:fixed; inset:0; z-index:1000; background:rgba(10,16,20,.92);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.photo-lightbox[hidden]{display:none;}
.lightbox-stage{max-width:min(92vw, 1000px); max-height:88vh; display:flex; flex-direction:column; align-items:center; gap:10px;}
.lightbox-stage img{max-width:100%; max-height:80vh; object-fit:contain; border-radius:6px; box-shadow:0 8px 30px rgba(0,0,0,.5); background:#111; display:block;}
.lightbox-caption{color:#E7EEF0; font-size:13px; text-align:center;}
.lightbox-close, .lightbox-nav{
  position:absolute; border:none; border-radius:50%; background:rgba(255,255,255,.12); color:#fff;
  line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.lightbox-close:hover, .lightbox-nav:hover{background:rgba(255,255,255,.22);}
.lightbox-close{top:16px; right:20px; width:40px; height:40px; font-size:22px;}
.lightbox-nav{top:50%; transform:translateY(-50%); width:48px; height:48px; font-size:26px;}
.lightbox-prev{left:16px;}
.lightbox-next{right:16px;}
@media (max-width:640px){
  .lightbox-nav{width:40px; height:40px; font-size:22px;}
  .lightbox-close{width:34px; height:34px; font-size:18px; top:10px; right:10px;}
}

/* ---------- job card (detail/print) ---------- */
.jobcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px 30px; box-shadow:var(--shadow);}
.jobcard-logos{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border);}
.jobcard-logos img{display:block; height:44px; width:auto; object-fit:contain;}
.logo-pln{margin-right:auto;}
.logo-pta{margin-left:auto;}
.jobcard-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; padding-bottom:18px; border-bottom:2px solid var(--ink);}
.jobcard-eyebrow{font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; margin-bottom:2px;}
.jobcard-head h1{font-size:22px;}
.jobcard-info{margin-bottom:22px;}
.info-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
.info-val{font-size:14.5px; font-weight:600; margin-top:3px;}
.jobcard-section{margin-bottom:26px;}
.jobcard-section:last-child{margin-bottom:0;}
.plain-list{margin:0; padding-left:20px; font-size:14px;}
.plain-list li{margin-bottom:4px;}
.check-list-view{list-style:none; margin:0; padding:0; font-size:13.5px;}
.check-list-view li{padding:6px 0 6px 24px; position:relative; border-bottom:1px solid #F0F2F1;}
.check-list-view li:last-child{border-bottom:none;}
.check-list-view li::before{position:absolute; left:0; top:6px; font-weight:700;}
.check-list-view li.yes{color:var(--ink);}
.check-list-view li.yes::before{content:'\2713'; color:var(--ok);}
.check-list-view li.no::before{content:'\2013'; color:var(--muted);}
.check-list-view li.no{color:var(--muted);}

/* ---------- tabel D. Tindakan Perawatan (dirapikan) ---------- */
.tindakan-table{border:1px solid var(--border); border-radius:8px; overflow:hidden; table-layout:fixed; width:100%;}
.tindakan-table col.col-no{width:56px;}
.tindakan-table col.col-item{width:22%;}
.tindakan-table col.col-tindakan{width:26%;}
.tindakan-table col.col-cek{width:52px;}
.tindakan-table col.col-ket{width:auto;}
.tindakan-table th{background:var(--primary-tint); color:var(--primary-dark); border-bottom:1px solid var(--border);}
.tindakan-table td, .tindakan-table th{border-right:1px solid #EEF1F0; padding:9px 10px; vertical-align:top; word-break:break-word;}
.tindakan-table td:last-child, .tindakan-table th:last-child{border-right:none;}
.tindakan-table tbody tr:not(.cat-row):hover{background:#FAFBFA;}
.tindakan-table .cat-row td{
  background:#EFF3F1; color:var(--primary-dark); font-weight:700; font-size:12.5px;
  text-transform:uppercase; letter-spacing:.03em; border-right:none; padding:7px 10px;
}
.tindakan-table .col-no{text-align:center; font-size:12px; white-space:nowrap;}
.tindakan-table .col-cek{text-align:center;}
.cek-yes{color:var(--ok); font-weight:700; font-size:15px;}
.cek-no{color:var(--border-strong);}

/* ---------- tanda tangan + QR ---------- */
.sign-body{display:flex; flex-direction:column; gap:10px;}
.sign-qr{flex:none; width:120px; height:120px; align-self:center; padding:4px; background:#fff; border:1px solid var(--border); border-radius:6px;}
.sign-qr svg{width:100%; height:100%; display:block;}
.sign-qr-caption{font-size:10px; color:var(--muted); text-align:center; margin-top:4px; letter-spacing:.02em;}

.sign-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.sign-block{border:1px solid var(--border); border-radius:8px; padding:14px 16px; min-height:96px;}
.sign-role{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:10px;}
.sign-name{font-weight:700; font-size:14.5px;}
.sign-company{font-size:11.5px; color:var(--muted); margin-top:1px;}
.sign-date{font-size:12px; color:var(--muted); margin-top:2px;}
.sign-note{font-size:12.5px; font-style:italic; color:var(--ink); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
.sign-pending{font-size:13px; color:var(--pending); font-weight:600;}

.approve-panel{background:var(--primary-tint); border-radius:10px; padding:18px 20px;}
.approve-panel h3{color:var(--primary-dark);}
.approve-panel textarea{resize:vertical;}

.guidance-banner{
  background:var(--pending-tint); border:1px solid #ECD9B0; color:#7A5210; border-radius:9px;
  padding:12px 16px; font-size:13.5px; line-height:1.55; margin-bottom:18px;
}
.guidance-banner strong{color:#5C3D0C;}

/* ---------- kelola user ---------- */
.tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab{
  background:none; border:none; padding:10px 16px; font-weight:600; font-size:13.5px; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:6px;
}
.tab:hover{color:var(--primary-dark);}
.tab.active{color:var(--primary-dark); border-bottom-color:var(--primary);}
.tab-count{background:var(--primary-tint); color:var(--primary-dark); font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px;}
.tab.active .tab-count{background:var(--primary); color:#fff;}
.search-input{width:100%; max-width:320px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:7px; font-size:13.5px; margin-bottom:14px;}
.row-actions{display:flex; gap:12px; justify-content:flex-end; white-space:nowrap;}
.link-btn.danger{color:var(--danger);}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--ink); color:#fff;
  padding:12px 20px; border-radius:8px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.toast.show{opacity:1; transform:translate(-50%,0);}
.toast.ok{background:var(--ok);}
.toast.warn{background:var(--danger);}

body.busy{cursor:progress;}
body.busy .main{opacity:.7; pointer-events:none;}

/* ---------- responsive ---------- */
@media (max-width:920px){
  .login-wrap{grid-template-columns:1fr;}
  .login-side{padding:36px 28px;}
  .login-points{display:none;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:1fr 1fr;}
  .sign-grid{grid-template-columns:1fr;}
}
@media (max-width:680px){
  .topbar{padding:10px 14px; gap:8px 12px; height:auto; flex-wrap:wrap;}
  .topbar-brand{order:1;}
  .topbar-user{order:2; margin-left:auto;}
  .topnav{order:3; flex-basis:100%; justify-content:flex-start;}
  .user-meta{display:none;}
  .main{padding:18px 14px 48px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .level-picker{grid-template-columns:repeat(5,1fr); gap:6px;}
  .level-opt-box{padding:10px 2px;}
  .citem{grid-template-columns:1fr; gap:4px;}
  .jobcard{padding:20px 16px;}
  .panel{overflow-x:auto;}
  .table{min-width:520px;}
}

/* ---------- print ---------- */
@media print{
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;}
  @page{margin:14mm 12mm;}
  body{background:#fff; font-size:12.5px;}
  .topbar, .toast, .no-print, .approve-panel{display:none !important;}
  .main{padding:0;}
  .page{max-width:none;}
  .jobcard{border:none; box-shadow:none; padding:0;}

  /* paksa tata letak desktop (kolom ganda) meski lebar kertas < breakpoint mobile */
  .jobcard-info.grid-3{grid-template-columns:repeat(3,1fr) !important;}
  .jobcard-section.grid-2{grid-template-columns:1fr 1fr !important;}
  .sign-grid{grid-template-columns:repeat(3,1fr) !important; gap:10px;}
  .jobcard-logos{display:flex !important;}

  /* jaga agar tak ada baris/kartu terpotong di tengah, tapi jangan paksa satu tabel besar jadi satu unit */
  .jobcard-section, .sign-block, .jobcard-info{page-break-inside:avoid; break-inside:avoid;}
  .section-tindakan{page-break-inside:auto; break-inside:auto;}
  .tindakan-table{page-break-inside:auto; break-inside:auto;}
  .tindakan-table tr{page-break-inside:avoid; break-inside:avoid;}
  .tindakan-table .cat-row{page-break-after:avoid; break-after:avoid;}
  .tindakan-table thead{display:table-header-group;}

  .sign-qr{width:26mm; height:26mm;}
  .status-badge, .pill, .tab-count{border:1px solid rgba(0,0,0,.15);}
  a[href]::after{content:'';}
}

</style>

    for (var i = 8; i < 256; i++) {

let serverOnline = null; // null = belum dicek, true/false setelah dicek

async function pingServer() {
  if (!db) { serverOnline = false; return false; }
  try {
    const { error } = await db.from('submissions').select('id', { count: 'exact', head: true }).limit(1);
    serverOnline = !error;
  } catch (e) {
    serverOnline = false;
  }
  return serverOnline;
}

/* ---- Submissions: disimpan & dibaca langsung dari tabel `submissions` ---- */
function rowToSubmission(row) {
  return Object.assign({}, row, {
    tanggal: row.tanggal || '',
    photoIds: (row.photos || []).map((p) => p.id),
    photoNames: (row.photos || []).map((p) => p.name || ''),
    photos: row.photos || [],
  });
}
function submissionToRow(sub) {
  const row = Object.assign({}, sub);
  delete row.photoIds; delete row.photoNames; delete row._photoCache;
  row.photos = sub.photos || [];
  return row;
}

async function loadSubmissions() {
  if (!db) return [];
  const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false });
  if (error) { toast('Gagal memuat data dari server. Periksa koneksi internet Anda.', 'warn'); return []; }
  return (data || []).map(rowToSubmission);
}
async function saveSubmissionRow(sub) {
  if (!db) return { ok: false, message: 'Aplikasi belum terhubung ke server (Supabase URL/Key belum diisi).' };
  const { error } = await db.from('submissions').upsert(submissionToRow(sub));
  if (error) {
    console.error('Gagal simpan submission:', error);
    return { ok: false, message: error.message || error.hint || error.code || 'Kesalahan tidak diketahui dari server.' };
  }
  return { ok: true };
}

/* ===================== UTIL ===================== */
function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, 3200);
}
function levelSortWeight(lv) { return LEVEL_META[lv] ? LEVEL_META[lv].urutan : 99; }

/* ===================== DATA USER (langsung dari server, real-time utk semua) =====================
   Berbeda dari versi offline: TIDAK ada lagi data user tertanam di file maupun disimpan per
   perangkat. Semua login, tambah/ubah/hapus user langsung membaca & menulis ke database
   pusat (Supabase) lewat fungsi RPC -- kolom password tidak pernah dikirim balik ke browser
   kecuali saat proses login itu sendiri (dicek di sisi server). */
const ROLE_KEYS = ['pelaksana', 'koordinator', 'team_leader', 'admin'];
let USER_LIST_CACHE = { pelaksana: [], koordinator: [], team_leader: [], admin: [] };

async function fetchUsersByRole(role) {
  if (!db) return [];
  const { data, error } = await db.rpc('list_users', { p_role: role });
  if (error) { console.error('list_users error', error); return []; }
  USER_LIST_CACHE[role] = data || [];
  return USER_LIST_CACHE[role];
}
function effectiveUsers(role) {
  const out = {};
  (USER_LIST_CACHE[role] || []).forEach((u) => { out[u.username] = u; });
  return out;
}
async function upsertUser(role, username, rec) {
  if (!db) return false;
  const { error } = await db.rpc('upsert_user', {
    p_username: rec.username, p_password: rec.password, p_nama: rec.nama, p_role: role,
    p_jabatan: rec.jabatan || null, p_pltd: rec.pltd || null, p_lokasi_tl: rec.lokasi_tl || null,
    p_mesin_cc: rec.mesin_cc || [], p_perusahaan: rec.perusahaan || null,
  });
  if (!error) await fetchUsersByRole(role);
  return !error;
}
async function removeUser(role, username) {
  if (!db) return false;
  const { error } = await db.rpc('delete_user', { p_username: username });
  if (!error) await fetchUsersByRole(role);
  return !error;
}

/* ===================== AUTENTIKASI ===================== */
async function doLogin(username, password) {
  if (!db) {
    return { ok: false, msg: 'Aplikasi belum terhubung ke server. Hubungi Admin untuk memasang alamat server (Supabase URL & Anon Key).' };
  }
  const { data, error } = await db.rpc('login_user', { p_username: username.trim(), p_password: password });
  if (error) {
    serverOnline = false;
    return { ok: false, msg: 'Tidak dapat terhubung ke server. Periksa koneksi internet Anda lalu coba lagi.' };
  }
  serverOnline = true;
  if (!data || data.length === 0) {
    return { ok: false, msg: 'Username atau password salah.' };
  }
  const rec = data[0];
  const role = rec.role;
  /* Cakupan LOKASI (bukan daftar mesin beku) -- supaya mesin baru yang ditambahkan
     belakangan di lokasi yang sama otomatis ikut terlihat tanpa perlu ubah data user. */
  let lokasiScope;
  if (role === 'admin') {
    lokasiScope = null; // null = seluruh lokasi
  } else if (role === 'pelaksana' || role === 'koordinator') {
    lokasiScope = rec.pltd ? [rec.pltd] : [];
  } else {
    const legacyCc = new Set(rec.mesin_cc || []);
    lokasiScope = [...new Set(MESIN_LIST.filter((m) => legacyCc.has(m.cost_center)).map((m) => m.lokasi))];
  }
  const scopeLabel = role === 'admin' ? 'Seluruh Lokasi' : role === 'team_leader' ? (rec.lokasi_tl || rec.jabatan) : rec.pltd;
  state.user = {
    username: rec.username,
    role,
    nama: rec.nama,
    jabatan: rec.jabatan,
    scopeLabel,
    lokasiScope,
    mesin_cc: new Set(),
    mesinList: [],
    perusahaan: rec.perusahaan || '',
  };
  recomputeUserMesinScope();
  state.submissions = await loadSubmissions();
  state.view = 'dashboard';
  return { ok: true };
}
/* Hitung ulang mesin_cc & mesinList milik user yang sedang login berdasarkan lokasiScope
   (daftar nama lokasi) terhadap data MESIN_LIST TERKINI. Dipanggil ulang tiap kali data
   mesin di-refresh, supaya penambahan/penghapusan mesin oleh Admin/TL langsung terlihat. */
function recomputeUserMesinScope() {
  const u = state.user;
  if (!u) return;
  const scopeLower = u.lokasiScope === null ? null : u.lokasiScope.map((l) => (l || '').trim().toLowerCase());
  const list = scopeLower === null ? MESIN_LIST.slice() : MESIN_LIST.filter((m) => scopeLower.includes((m.lokasi || '').trim().toLowerCase()));
  u.mesinList = list.slice().sort((a, b) => a.unit.localeCompare(b.unit));
  u.mesin_cc = new Set(list.map((m) => m.cost_center));
}
function doLogout() {
  state.user = null;
  state.view = 'login';
  state.detailId = null;
  state.draft = null;
  render();
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Gagal memuat gambar'));
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function draftAddPhotos(fileList) {
  const files = Array.from(fileList).slice(0, 8 - state.draft.photoIds.length);
  if (files.length === 0) { toast('Maksimum 8 foto per checklist.', 'warn'); return; }
  state.busy = true; render();
  for (const f of files) {
    try {
      const dataUrl = await compressImage(f);
      const id = uid('photo');
      state.draft.photoIds.push(id);
      state.draft.photoNames.push(f.name);
      state.draft.photos.push({ id, name: f.name, dataUrl });
      state.draft._photoCache = state.draft._photoCache || {};
      state.draft._photoCache[id] = dataUrl;
    } catch (e) {
      toast('Gagal memproses salah satu foto.', 'warn');
    }
  }
  state.busy = false;
  render();
}
async function draftRemovePhoto(idx) {
  const id = state.draft.photoIds[idx];
  state.draft.photoIds.splice(idx, 1);
  state.draft.photoNames.splice(idx, 1);
  state.draft.photos = state.draft.photos.filter((p) => p.id !== id);
  render();
}

function validateDraft(d) {
  if (!d.tanggal) return 'Tanggal pemeliharaan wajib diisi.';
  if (!d.tenaga.some((t) => t.trim())) return 'Minimal satu nama tenaga pelaksana wajib diisi.';
  if (!d.status_mesin.trim()) return 'Status mesin wajib diisi.';
  return null;
}

async function submitDraft() {
  const err = validateDraft(state.draft);
  if (err) { toast(err, 'warn'); return; }
  state.draft.tenaga = state.draft.tenaga.filter((t) => t.trim());
  state.draft.material = state.draft.material.filter((r) => r.uraian.trim());
  state.draft.temuan = state.draft.temuan.filter((r) => r.uraian.trim());
  delete state.draft._photoCache;
  state.busy = true; render();
  const result = await saveSubmissionRow(state.draft);
  if (result.ok) state.submissions.push(state.draft);
  state.busy = false;
  if (result.ok) {
    toast('Checklist tersimpan ke server & langsung terlihat oleh Koordinator PLTD.', 'ok');
    state.detailId = state.draft.id;
    state.draft = null;
    state.view = 'detail';
  } else {
    toast('Gagal menyimpan: ' + result.message, 'warn');
  }
  render();
}

/* ===================== AKSI PERSETUJUAN ===================== */
async function approveSubmission(sub, catatan) {
  const role = state.user.role;
  if (role === 'koordinator') {
    sub.status = 'menunggu_tl';
    sub.koordinator_user = state.user.username;
    sub.koordinator_nama = state.user.nama;
    sub.koordinator_perusahaan = state.user.perusahaan || '';
    sub.koordinator_tgl = new Date().toISOString();
    sub.koordinator_catatan = catatan || '';
  } else if (role === 'team_leader') {
    sub.status = 'selesai';
    sub.tl_user = state.user.username;
    sub.tl_nama = state.user.nama;
    sub.tl_perusahaan = state.user.perusahaan || '';
    sub.tl_tgl = new Date().toISOString();
    sub.tl_catatan = catatan || '';
  }
  sub.updated_at = new Date().toISOString();
  state.busy = true; render();
  const result = await saveSubmissionRow(sub);
  state.busy = false;
  if (result.ok) toast('Disetujui & tersimpan ke server. Langsung terlihat oleh tahap berikutnya.', 'ok'); else toast('Gagal menyimpan: ' + result.message, 'warn');
  render();
}
async function rejectSubmission(sub, catatan) {
  const role = state.user.role;
  if (!catatan || !catatan.trim()) { toast('Catatan penolakan wajib diisi.', 'warn'); return; }
  if (role === 'koordinator') {
    sub.status = 'ditolak_koordinator';
    sub.koordinator_user = state.user.username;
    sub.koordinator_nama = state.user.nama;
    sub.koordinator_perusahaan = state.user.perusahaan || '';
    sub.koordinator_tgl = new Date().toISOString();
    sub.koordinator_catatan = catatan;
  } else if (role === 'team_leader') {
    sub.status = 'ditolak_tl';
    sub.tl_user = state.user.username;
    sub.tl_nama = state.user.nama;
    sub.tl_perusahaan = state.user.perusahaan || '';
    sub.tl_tgl = new Date().toISOString();
    sub.tl_catatan = catatan;
  }
  sub.updated_at = new Date().toISOString();
  state.busy = true; render();
  const result = await saveSubmissionRow(sub);
  state.busy = false;
  if (result.ok) toast('Dikembalikan ke Pelaksana & tersimpan ke server.', 'warn'); else toast('Gagal menyimpan: ' + result.message, 'warn');
  render();
}

/* ===================== RENDER: ROOT ===================== */
function render() {
  const root = document.getElementById('app');
  if (!state.user) {
    root.innerHTML = viewLogin();
    bindLogin();
    return;
  }
  root.innerHTML = shellHTML();
  document.body.classList.add('logged-in');
  const main = document.getElementById('main');
  if (state.view === 'dashboard') main.innerHTML = viewDashboard();
  else if (state.view === 'newChecklist') main.innerHTML = viewNewChecklist();
  else if (state.view === 'detail') main.innerHTML = viewDetail();
  else if (state.view === 'history') main.innerHTML = viewHistory();
  else if (state.view === 'manageUsers') main.innerHTML = viewManageUsers();
  else if (state.view === 'manageMesin') main.innerHTML = viewManageMesin();
  bindShell();
  if (state.view === 'dashboard') bindDashboard();
  else if (state.view === 'newChecklist') bindNewChecklist();
  else if (state.view === 'detail') bindDetail();
  else if (state.view === 'history') bindHistory();
  else if (state.view === 'manageUsers') bindManageUsers();
  else if (state.view === 'manageMesin') bindManageMesin();
  if (state.busy) document.body.classList.add('busy'); else document.body.classList.remove('busy');
}

function statusCounts(list) {
  const c = { menunggu_koordinator: 0, menunggu_tl: 0, selesai: 0, ditolak: 0, total: list.length };
  list.forEach((s) => {
    if (s.status === 'menunggu_koordinator') c.menunggu_koordinator++;
    else if (s.status === 'menunggu_tl') c.menunggu_tl++;
    else if (s.status === 'selesai') c.selesai++;
    else c.ditolak++;
  });
  return c;
}
function submissionRow(s, opts) {
  opts = opts || {};
  const st = STATUS_META[s.status] || { label: s.status, cls: '' };
  return `
  <tr class="row-click" data-open="${s.id}">
    <td>
      <div class="cell-strong">${esc(s.mesin_unit)}</div>
      <div class="cell-sub mono">${esc(s.cost_center)} &middot; ${esc(s.merk_type)}</div>
    </td>
    <td><span class="pill pill-level">${esc(s.level)}</span></td>
    <td>${fmtDate(s.tanggal)}</td>

    ${opts.showPelaksana ? `<td>${esc(s.pelaksana_nama)}</td>` : ''}
    <td><span class="status-badge ${st.cls}">${st.label}</span></td>
  </tr>`;
}

let _detailPhotoCache = {};

/* Teks ringkasan verifikasi yang dikodekan ke QR untuk satu tahap tanda tangan */
function buildQRText(sub, stageLabel, nama, waktu) {
  const st = STATUS_META[sub.status] || { label: sub.status };
  return [
    'SIAGA P0-P4',
    'Unit: ' + sub.mesin_unit,
    'Level: ' + sub.level + ' (' + (LEVEL_META[sub.level] ? LEVEL_META[sub.level].jam : '') + ')',
    'Tgl: ' + fmtDate(sub.tanggal),
    'Status: ' + st.label,
    stageLabel + ': ' + nama,
    'Waktu: ' + fmtDateTime(waktu),
  ].join('\n');
}
function qrSVG(text) {
  try {
    return SiagaQR.toSVG(text, { margin: 2, dark: '#16232B', light: '#FFFFFF' });
  } catch (e) {
    return '';
  }
}

function signBlock(label, nama, tgl, catatan, pendingLabel, qrText, perusahaan) {
  return `
  <div class="sign-block">
    <div class="sign-role">${label}</div>
    ${nama ? `
      <div class="sign-body">
        <div class="sign-text">

          ${perusahaan ? `<div class="sign-company">${esc(perusahaan)}</div>` : ''}
          <div class="sign-date">${fmtDateTime(tgl)}</div>
          ${catatan ? `<div class="sign-note">&ldquo;${esc(catatan)}&rdquo;</div>` : ''}
        </div>
        ${qrText ? `<div><div class="sign-qr" title="Kode verifikasi">${qrSVG(qrText)}</div><div class="sign-qr-caption">Pindai utk verifikasi</div></div>` : ''}
      </div>
    ` : `<div class="sign-pending">${pendingLabel}</div>`}
  </div>`;
}

function viewDetail() {
  const s = state.submissions.find((x) => x.id === state.detailId);

async function loadDetailPhotos(s) {
  for (let i = 0; i < s.photoIds.length; i++) {
    const id = s.photoIds[i];
    if (!_detailPhotoCache[id]) {
      _detailPhotoCache[id] = await getPhoto(id);
    }
    const img = document.getElementById('img_' + id);
    if (img && _detailPhotoCache[id]) img.src = _detailPhotoCache[id];
    const thumb = img ? img.closest('.photo-thumb') : null;
    if (thumb && !thumb._lightboxBound) {
      thumb._lightboxBound = true;
      thumb.addEventListener('click', () => openLightbox(s.photoIds, s.photoNames, i));
    }
  }
}

/* ===================== LIGHTBOX (perbesar foto dokumentasi) ===================== */
let _lightboxState = { ids: [], names: [], index: 0 };

function ensureLightboxEl() {
  let el = document.getElementById('photoLightbox');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'photoLightbox';
  el.className = 'photo-lightbox no-print';
  el.hidden = true;
  el.innerHTML = `
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Tutup">&times;</button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Sebelumnya">&#8249;</button>
    <div class="lightbox-stage">
      <img id="lightboxImg" alt="">
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
    <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Berikutnya">&#8250;</button>
  `;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) closeLightbox(); });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); lightboxStep(-1); });
  document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); lightboxStep(1); });
  document.addEventListener('keydown', (e) => {
    const box = document.getElementById('photoLightbox');
    if (!box || box.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lightboxStep(-1);
    else if (e.key === 'ArrowRight') lightboxStep(1);
  });
  return el;
}

async function openLightbox(ids, names, index) {
  if (!ids || !ids.length) return;
  _lightboxState = { ids, names: names || [], index };
  const el = ensureLightboxEl();
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  await showLightboxIndex(index);
}

function closeLightbox() {
  const el = document.getElementById('photoLightbox');
  if (el) el.hidden = true;
  document.body.style.overflow = '';
}

function lightboxStep(delta) {
  const n = _lightboxState.ids.length;
  if (!n) return;
  const idx = (_lightboxState.index + delta + n) % n;
  showLightboxIndex(idx);
}

async function showLightboxIndex(idx) {
  _lightboxState.index = idx;
  const id = _lightboxState.ids[idx];
  const name = _lightboxState.names[idx] || '';
  const n = _lightboxState.ids.length;
  if (!_detailPhotoCache[id]) {
    _detailPhotoCache[id] = await getPhoto(id);
  }
  const img = document.getElementById('lightboxImg');
  const cap = document.getElementById('lightboxCaption');
  if (img) { img.src = _detailPhotoCache[id] || ''; img.alt = name; }
  if (cap) cap.textContent = (name ? name + ' · ' : '') + (idx + 1) + ' / ' + n;
  const multi = n > 1;
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');
  if (prevBtn) prevBtn.style.display = multi ? '' : 'none';
  if (nextBtn) nextBtn.style.display = multi ? '' : 'none';
}

function findInAnyRoleCache(username) {
  const u = username.trim().toLowerCase();
  for (const role of ROLE_KEYS) {
    const hit = (USER_LIST_CACHE[role] || []).find((x) => x.username.toLowerCase() === u);
    if (hit) return { role, rec: hit };
  }
  return null;
}

async function submitUserForm() {
  const f = state.manageForm;
  const d = f.data;
  if (!d.username.trim() || !d.password.trim() || !d.nama.trim()) {
    toast('Username, password, dan nama wajib diisi.', 'warn'); return;
  }
  const isNew = !f.editingUsername;
  if (isNew) {
    const existing = findInAnyRoleCache(d.username.trim());
    if (existing) { toast('Username sudah dipakai user lain.', 'warn'); return; }
  } else if (f.editingUsername.toLowerCase() !== d.username.trim().toLowerCase()) {
    const existing = findInAnyRoleCache(d.username.trim());
    if (existing) { toast('Username baru sudah dipakai user lain.', 'warn'); return; }
  }

  let rec;
  if (f.role === 'pelaksana') {
    rec = { username: d.username.trim(), password: d.password.trim(), nama: d.nama.trim().toUpperCase(), jabatan: 'Pelaksana Pemeliharaan', pltd: d.pltd, lokasi_tl: null, mesin_cc: ccForLokasiList([d.pltd]), perusahaan: d.perusahaan };
  } else if (f.role === 'koordinator') {
    rec = { username: d.username.trim(), password: d.password.trim(), nama: d.nama.trim().toUpperCase(), jabatan: d.jabatan.trim() || ('Koordinator PLTD ' + d.pltd), pltd: d.pltd, lokasi_tl: null, mesin_cc: ccForLokasiList([d.pltd]), perusahaan: d.perusahaan };
  } else if (f.role === 'team_leader') {
    if (!d.pltds || d.pltds.length === 0) { toast('Pilih minimal satu lokasi PLTD cakupan Team Leader.', 'warn'); return; }
    rec = { username: d.username.trim(), password: d.password.trim(), nama: d.nama.trim().toUpperCase(), jabatan: d.jabatan.trim() || 'Team Leader UPP', pltd: null, lokasi_tl: d.lokasi_tl.trim() || 'UPP', mesin_cc: ccForLokasiList(d.pltds), perusahaan: d.perusahaan };
  } else {
    rec = { username: d.username.trim(), password: d.password.trim(), nama: d.nama.trim().toUpperCase(), jabatan: d.jabatan.trim() || 'Administrator Sistem', pltd: null, lokasi_tl: null, mesin_cc: MESIN_LIST.map((m) => m.cost_center), perusahaan: d.perusahaan };
  }

  state.busy = true; render();
  // jika username diganti saat edit, hapus entri lama
  if (!isNew && f.editingUsername !== rec.username) {
    await removeUser(f.role, f.editingUsername);
  }
  await upsertUser(f.role, rec.username, rec);
  state.busy = false;
  state.manageForm = null;
  toast(isNew ? 'User baru ditambahkan.' : 'Data user diperbarui.', 'ok');
  render();
}

/* ===================== KELOLA MESIN (Admin & Team Leader) ===================== */
function mesinInScope() {
  if (state.user.role === 'admin') return MESIN_LIST.slice();
  return MESIN_LIST.filter((m) => state.user.mesin_cc.has(m.cost_center));
}
function myLokasiScope() {
  if (state.user.role === 'admin') return LOKASI_LIST.slice();
  return [...new Set(mesinInScope().map((m) => m.lokasi))].sort();
}
function findUppForLokasi(lokasi) {
  const hit = MESIN_LIST.find((m) => m.lokasi === lokasi);
  return hit ? (hit.upp || '') : '';
}
async function upsertMesin(rec) {
  if (!db) return { ok: false, message: 'Belum terhubung ke server.' };
  const { error } = await db.from('mesin').upsert(rec);
  if (error) { console.error('Gagal simpan mesin:', error); return { ok: false, message: error.message || 'Kesalahan tidak diketahui dari server.' }; }
  await fetchMesinList();
  recomputeUserMesinScope();
  return { ok: true };
}
async function deleteMesinRow(costCenter) {
  if (!db) return { ok: false, message: 'Belum terhubung ke server.' };
  const { error } = await db.from('mesin').delete().eq('cost_center', costCenter);
  if (error) { console.error('Gagal hapus mesin:', error); return { ok: false, message: error.message || 'Kesalahan tidak diketahui dari server.' }; }
  await fetchMesinList();
  recomputeUserMesinScope();
  return { ok: true };
}
function emptyMesinFormData() {
  const lokasiOpts = myLokasiScope();
  const defaultLokasi = lokasiOpts[0] || '';
  return { cost_center: '', unit: '', merk_type: '', no_seri: '', daya: '', lokasi: defaultLokasi, upp: findUppForLokasi(defaultLokasi) };
}
function openAddMesinForm() {
  state.mesinForm = { editingCostCenter: null, data: emptyMesinFormData() };
  render();
}
function openEditMesinForm(costCenter) {
  const m = MESIN_BY_CC[costCenter];
  if (!m) return;
  state.mesinForm = {
    editingCostCenter: costCenter,
    data: { cost_center: m.cost_center, unit: m.unit || '', merk_type: m.merk_type || '', no_seri: m.no_seri || '', daya: (m.daya === null || m.daya === undefined) ? '' : String(m.daya), lokasi: m.lokasi || '', upp: m.upp || '' },
  };
  render();
}
function closeMesinForm() { state.mesinForm = null; render(); }

async function submitMesinForm() {
  const f = state.mesinForm;
  const d = f.data;
  if (!d.cost_center.trim() || !d.unit.trim() || !d.lokasi.trim()) {
    toast('No. Cost Center, Nama Unit, dan Lokasi wajib diisi.', 'warn'); return;
  }
  const isNew = !f.editingCostCenter;
  if (isNew && MESIN_BY_CC[d.cost_center.trim()]) {
    toast('No. Cost Center sudah dipakai mesin lain.', 'warn'); return;
  }
  if (state.user.role === 'team_leader' && !myLokasiScope().includes(d.lokasi.trim())) {
    toast('Anda hanya bisa mengelola mesin di lokasi cakupan Anda.', 'warn'); return;
  }
  const rec = {
    cost_center: d.cost_center.trim(),
    unit: d.unit.trim(),
    merk_type: d.merk_type.trim() || null,
    no_seri: d.no_seri.trim() || null,
    daya: d.daya === '' ? null : Number(d.daya),
    lokasi: d.lokasi.trim(),
    upp: d.upp.trim() || null,
    updated_at: new Date().toISOString(),
  };
  state.busy = true; render();
  const result = await upsertMesin(rec);
  state.busy = false;
  if (result.ok) {
    state.mesinForm = null;
    toast(isNew ? 'Mesin baru ditambahkan.' : 'Data mesin diperbarui.', 'ok');
  } else {
    toast('Gagal menyimpan: ' + result.message, 'warn');
  }
  render();
}
async function confirmDeleteMesin(costCenter, nama) {
  if (state.user.role === 'team_leader' && !state.user.mesin_cc.has(costCenter)) {
    toast('Anda tidak berwenang menghapus mesin ini.', 'warn'); return;
  }
  if (!window.confirm(`Hapus mesin "${nama}"?\n\nRiwayat checklist yang sudah ada untuk mesin ini TIDAK akan terhapus, tapi mesin ini tidak akan muncul lagi di pilihan Pelaksana, dan riwayat lamanya mungkin tidak lagi tampil di daftar Riwayat Anda.`)) return;
  state.busy = true; render();
  const result = await deleteMesinRow(costCenter);
  state.busy = false;
  if (result.ok) toast('Mesin dihapus dari server.', 'warn'); else toast('Gagal menghapus: ' + result.message, 'warn');
  render();
}

/* ===================== EKSPOR / IMPOR (transfer data antar perangkat) ===================== */
function slugForFile(s) {
  return String(s).replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 40);
}
async function exportSubmission(sub) {
  const photos = [];
  for (let i = 0; i < sub.photoIds.length; i++) {
    const id = sub.photoIds[i];
    const dataUrl = await getPhoto(id);
    if (dataUrl) photos.push({ id, name: sub.photoNames[i] || '', dataUrl });
  }
  const payload = {
    app: 'SIAGA_P0P4', version: 1, exported_at: new Date().toISOString(),
    submission: Object.assign({}, sub, { photos }),
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Checklist_${sub.level}_${slugForFile(sub.mesin_unit)}_${sub.tanggal}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
